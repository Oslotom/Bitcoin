<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kjøpe Bitcoin i Norge (2026)</title>
    <meta name="description" content="Finn billigste pris på Bitcoin i Norge. Sammenlign gebyrer, spread og priser live." />
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <script type="text/javascript">
      // Simple redirect for Single Page Apps on GitHub Pages
      // This handles deep links by redirecting them back to index.html
      var pathSegment = window.location.pathname;
      if (pathSegment !== '/' && !pathSegment.includes('.')) {
        window.location.replace('/' + '?p=' + pathSegment.replace(/^\//, ''));
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- This will be replaced by Vite during build -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
