# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full historikk: sitemap/lastmod bruker git-datoen for siste endring per side
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
        env:
          # Valgfritt: sett repo-variabelen VITE_CONTACT_ENDPOINT (f.eks. en Formspree-URL)
          VITE_CONTACT_ENDPOINT: ${{ vars.VITE_CONTACT_ENDPOINT }}
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify search engines (IndexNow)
        # Varsler Bing (driver også ChatGPT-søk og Copilot), Yandex m.fl. om nye/endrede sider
        continue-on-error: true
        env:
          INDEXNOW_KEY: b593ace36b5cf7dcad0de56db2a3e5fe
          HOST: www.xn--kjpebitcoin-hgb.no
        run: |
          grep -o '<loc>[^<]*' dist/sitemap.xml | sed 's/<loc>//' \
            | jq -R . | jq -s --arg host "$HOST" --arg key "$INDEXNOW_KEY" \
              '{host: $host, key: $key, keyLocation: "https://\($host)/\($key).txt", urlList: .}' > indexnow.json
          curl -sS -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data @indexnow.json -w '\nIndexNow HTTP %{http_code}\n'
